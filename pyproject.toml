[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ab-factcheck"
version = "0.1.0"
description = "B-group evidence-based fact-checking experiments and benchmark preparation"
requires-python = ">=3.10"
dependencies = ["httpx>=0.28,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
symbolic = ["z3-solver>=4.13,<5", "jsonschema>=4.23,<5"]

[project.scripts]
ab-factcheck = "ab_factcheck.cli:main"
ab-symbolic-z3 = "ab_factcheck.symbolic_z3.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--basetemp=outputs/pytest-tmp"

[tool.setuptools.packages.find]
where = ["src"]
